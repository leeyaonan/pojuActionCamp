[alembic]
# 迁移脚本目录
script_location = alembic

# 模板（默认）
# file_template = %%(rev)s_%%(slug)s

# 时间戳显示格式
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 数据库 URL 留空，由 env.py 从 app.config.Settings 动态注入（同步 sqlite）
sqlalchemy.url =

# 输出目录
# output_encoding = utf-8

[post_write_hooks]
# 可在此处接入格式化钩子，MVP 暂不启用

# logging 配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
